name = "another-me"
pages_build_output_dir = "."
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "another-me-db"
database_id = "your-d1-database-id"

# Uncomment if using KV for caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

[vars]
APP_NAME = "Another Me"

[env.production.vars]
APP_NAME = "Another Me"
